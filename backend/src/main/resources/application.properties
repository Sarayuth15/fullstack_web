# Load local secrets from backend/.env.local (KEY=VALUE format) when present.
# Real OS environment variables take precedence over values in this file.
spring.config.import=optional:file:.env.local[.properties]

server.port=${SERVER_PORT:8080}

# Database - credentials have no defaults and must be provided via env vars or .env.local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/myapp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
